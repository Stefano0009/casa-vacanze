name: Promemoria arrivi

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      data_prova:
        description: "Facoltativo: simula gli arrivi di questa data (AAAA-MM-GG)"
        required: false

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node invia.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATA_PROVA: ${{ github.event.inputs.data_prova }}
